name: Build XARVIS APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle
    - name: Make gradlew executable
      run: chmod +x gradlew
    - name: Build debug APK
      run: |
        set -o pipefail
        ./gradlew testDebugUnitTest assembleDebug 2>&1 | tee build.log
    - name: Report build errors
      if: failure()
      # Surfaces compiler errors as an annotation, readable through the GitHub API without the raw log.
      run: |
        msg=$(grep -E "^e: |error:|What went wrong| FAILED$" -A3 build.log | head -60 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
        echo "::error title=Build errors::${msg}"
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: XARVIS-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
