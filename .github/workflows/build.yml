name: Build XARVIS APK

on:
  push:
    branches: [ main, master, 'test-*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

# One build per branch at a time, in push order: two main builds running side by side once let the older
# one (v1.0.213) finish last and become "latest", so the in-app updater offered it over v1.0.214.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # to publish each build as a GitHub release (a direct APK download)
    steps:
    - uses: actions/checkout@v5
    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle
    - name: Make gradlew executable
      run: chmod +x gradlew
    - name: Set up the permanent signing key
      env:
        XARVIS_KEYSTORE: ${{ secrets.XARVIS_KEYSTORE }}
      run: |
        if [ -n "$XARVIS_KEYSTORE" ]; then
          echo "$XARVIS_KEYSTORE" | tr -d ' \n\r' | base64 -d > "$RUNNER_TEMP/xarvis.keystore"
          echo "XARVIS_KEYSTORE_FILE=$RUNNER_TEMP/xarvis.keystore" >> "$GITHUB_ENV"
        else
          echo "::warning title=No permanent signing key::The XARVIS_KEYSTORE secret isn't set, so this APK can't install as an upgrade over one signed with the permanent key."
        fi
    - name: Keep the voice engine between builds
      # So a GitHub download hiccup (a 504 on 9 Nov 2026 blocked a release) can't stop a build once it's cached.
      uses: actions/cache@v4
      with:
        path: app/libs/sherpa-onnx-1.13.8.aar
        key: sherpa-onnx-1.13.8-aar
    - name: Download the voice engine
      # sherpa-onnx (offline speech engine for Rex's own voice); too big to keep in git.
      run: |
        mkdir -p app/libs
        if [ ! -s app/libs/sherpa-onnx-1.13.8.aar ]; then
          curl -fsSL --retry 8 --retry-delay 20 --retry-all-errors -o app/libs/sherpa-onnx-1.13.8.aar https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.8/sherpa-onnx-1.13.8.aar
        fi
    - name: Test and build debug APK
      run: |
        set -o pipefail
        ./gradlew testFullDebugUnitTest assembleDebug 2>&1 | tee build.log
    - name: Check the APK is signed with the permanent key
      run: |
        apksigner=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner
        actual=$("$apksigner" verify --print-certs app/build/outputs/apk/full/debug/app-full-debug.apk | grep -m1 "SHA-256 digest" | awk '{print $NF}' | tr 'a-f' 'A-F' | sed 's/../&:/g; s/:$//')
        expected=$(cat .github/signing-cert-sha256.txt)
        echo "::notice title=Signing certificate::$actual"
        if [ -n "$XARVIS_KEYSTORE_FILE" ] && [ "$actual" != "$expected" ]; then
          echo "::error title=Wrong signing key::APK is signed with $actual, expected $expected"
          exit 1
        fi
    - name: Report build errors
      if: failure()
      # Surfaces compiler and test errors as an annotation, readable through the GitHub API without the raw log.
      run: |
        msg=$(grep -E "^e: |error:|What went wrong| FAILED$" -A3 build.log | head -60 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
        echo "::error title=Build errors::${msg}"
    # A new file name each version: a leftover app-debug.apk in Downloads made extracting fail.
    - name: Name the APKs after their version
      run: |
        mkdir -p out
        cp app/build/outputs/apk/full/debug/app-full-debug.apk "out/XARVIS-v1.0.${{ github.run_number }}.apk"
        cp app/build/outputs/apk/benco/debug/app-benco-debug.apk "out/XARVIS-benco-v1.0.${{ github.run_number }}.apk"
        # XARVIS Hands: the tiny Accessibility-only app (install test on the S22).
        cp hands/build/outputs/apk/debug/hands-debug.apk "out/XARVIS-Hands-v1.0.${{ github.run_number }}.apk"
        # XARVIS Eyes: the small camera app.
        cp eyes/build/outputs/apk/debug/eyes-debug.apk "out/XARVIS-Eyes-v1.0.${{ github.run_number }}.apk"
        # XARVIS Helper: the small app for a family phone that asks Rex for help.
        cp helper/build/outputs/apk/debug/helper-debug.apk "out/XARVIS-Helper-v1.0.${{ github.run_number }}.apk"
        # XARVIS Remote: the separate remote-control app (reach the S22 when XARVIS on it is down or updating).
        cp remote/build/outputs/apk/debug/remote-debug.apk "out/XARVIS-Remote-v1.0.${{ github.run_number }}.apk"
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: XARVIS-v1.0.${{ github.run_number }}-apk
        path: out/*.apk
    # A direct download, no zip and no GitHub sign-in: the phone's browser downloads the APK and
    # installs it. releases/latest/download/XARVIS.apk always points at the newest build.
    - name: Publish as a release
      if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        v="1.0.${{ github.run_number }}"
        cd out
        cp "XARVIS-v$v.apk" XARVIS.apk
        cp "XARVIS-benco-v$v.apk" XARVIS-benco.apk
        cp "XARVIS-Hands-v$v.apk" XARVIS-Hands.apk
        cp "XARVIS-Eyes-v$v.apk" XARVIS-Eyes.apk
        cp "XARVIS-Helper-v$v.apk" XARVIS-Helper.apk
        cp "XARVIS-Remote-v$v.apk" XARVIS-Remote.apk
        gh release create "v$v" "XARVIS-v$v.apk" "XARVIS-benco-v$v.apk" "XARVIS-Hands-v$v.apk" "XARVIS-Eyes-v$v.apk" "XARVIS-Helper-v$v.apk" "XARVIS-Remote-v$v.apk" XARVIS.apk XARVIS-benco.apk XARVIS-Hands.apk XARVIS-Eyes.apk XARVIS-Helper.apk XARVIS-Remote.apk --repo "${{ github.repository }}" \
          --target "${{ github.sha }}" --title "XARVIS v$v" --latest \
          --notes "S22: XARVIS.apk. Benco: XARVIS-benco.apk (no permission to place calls; the benco rejects it). XARVIS-Hands.apk is the tiny Accessibility app; XARVIS-Eyes.apk is the camera app; XARVIS-Helper.apk is for a family phone that asks for help; XARVIS-Remote.apk is the separate remote-control app for your own phones. Always newest: https://github.com/${{ github.repository }}/releases/latest/download/XARVIS.apk , .../XARVIS-benco.apk, .../XARVIS-Hands.apk, .../XARVIS-Eyes.apk, .../XARVIS-Helper.apk and .../XARVIS-Remote.apk"
    # A test-* branch (an install experiment): published as a pre-release that is never "latest", so
    # the phones' UPDATE button and the releases/latest links keep pointing at the real build.
    - name: Publish a test build (never "latest")
      if: github.event_name != 'pull_request' && startsWith(github.ref, 'refs/heads/test-')
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        v="1.0.${{ github.run_number }}"
        tag="${GITHUB_REF_NAME}-v$v"
        cd out
        cp "XARVIS-v$v.apk" "XARVIS-${GITHUB_REF_NAME}.apk"
        gh release create "$tag" "XARVIS-${GITHUB_REF_NAME}.apk" --repo "${{ github.repository }}" \
          --target "${{ github.sha }}" --title "TEST ${GITHUB_REF_NAME} v$v" --prerelease --latest=false \
          --notes "Install test only (S22 build). Not the normal update: install it over XARVIS to see if the phone accepts it."
