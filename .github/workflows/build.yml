name: Build XARVIS APK

on:
  push:
    branches: [ main, master, 'test-*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # to publish each build as a GitHub release (a direct APK download)
    steps:
    - uses: actions/checkout@v5
    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle
    - name: Make gradlew executable
      run: chmod +x gradlew
    - name: Set up the permanent signing key
      env:
        XARVIS_KEYSTORE: ${{ secrets.XARVIS_KEYSTORE }}
      run: |
        if [ -n "$XARVIS_KEYSTORE" ]; then
          echo "$XARVIS_KEYSTORE" | tr -d ' \n\r' | base64 -d > "$RUNNER_TEMP/xarvis.keystore"
          echo "XARVIS_KEYSTORE_FILE=$RUNNER_TEMP/xarvis.keystore" >> "$GITHUB_ENV"
        else
          echo "::warning title=No permanent signing key::The XARVIS_KEYSTORE secret isn't set, so this APK can't install as an upgrade over one signed with the permanent key."
        fi
    - name: Test and build debug APK
      run: |
        set -o pipefail
        ./gradlew testFullDebugUnitTest assembleDebug 2>&1 | tee build.log
    - name: Check the APK is signed with the permanent key
      run: |
        apksigner=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner
        actual=$("$apksigner" verify --print-certs app/build/outputs/apk/full/debug/app-full-debug.apk | grep -m1 "SHA-256 digest" | awk '{print $NF}' | tr 'a-f' 'A-F' | sed 's/../&:/g; s/:$//')
        expected=$(cat .github/signing-cert-sha256.txt)
        echo "::notice title=Signing certificate::$actual"
        if [ -n "$XARVIS_KEYSTORE_FILE" ] && [ "$actual" != "$expected" ]; then
          echo "::error title=Wrong signing key::APK is signed with $actual, expected $expected"
          exit 1
        fi
    - name: Report build errors
      if: failure()
      # Surfaces compiler and test errors as an annotation, readable through the GitHub API without the raw log.
      run: |
        msg=$(grep -E "^e: |error:|What went wrong| FAILED$" -A3 build.log | head -60 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
        echo "::error title=Build errors::${msg}"
    # A new file name each version: a leftover app-debug.apk in Downloads made extracting fail.
    - name: Name the APKs after their version
      run: |
        mkdir -p out
        cp app/build/outputs/apk/full/debug/app-full-debug.apk "out/XARVIS-v1.0.${{ github.run_number }}.apk"
        cp app/build/outputs/apk/benco/debug/app-benco-debug.apk "out/XARVIS-benco-v1.0.${{ github.run_number }}.apk"
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: XARVIS-v1.0.${{ github.run_number }}-apk
        path: out/*.apk
    # A direct download, no zip and no GitHub sign-in: the phone's browser downloads the APK and
    # installs it. releases/latest/download/XARVIS.apk always points at the newest build.
    - name: Publish as a release
      if: github.event_name != 'pull_request'
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        v="1.0.${{ github.run_number }}"
        cd out
        cp "XARVIS-v$v.apk" XARVIS.apk
        cp "XARVIS-benco-v$v.apk" XARVIS-benco.apk
        gh release create "test-allabi-v$v" "XARVIS-v$v.apk" "XARVIS-benco-v$v.apk" XARVIS.apk XARVIS-benco.apk --repo "${{ github.repository }}" \
          --target "${{ github.sha }}" --title "TEST test-allabi v$v" --prerelease --latest=false \
          --notes "S22: XARVIS.apk. Benco: XARVIS-benco.apk (no permission to place calls; the benco rejects it). Always newest: https://github.com/${{ github.repository }}/releases/latest/download/XARVIS.apk and .../XARVIS-benco.apk"
