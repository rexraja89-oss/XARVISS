# One-off test: four builds that leave out different permissions, to find which one the benco rejects.
name: Permission test builds
on:
  push:
    branches: [ test-perms ]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle
    - env:
        XARVIS_KEYSTORE: ${{ secrets.XARVIS_KEYSTORE }}
      run: |
        echo "$XARVIS_KEYSTORE" | tr -d ' \n\r' | base64 -d > "$RUNNER_TEMP/xarvis.keystore"
        echo "XARVIS_KEYSTORE_FILE=$RUNNER_TEMP/xarvis.keystore" >> "$GITHUB_ENV"
    - env:
        TEST_VERSION_CODE: "26"
      run: |
        chmod +x gradlew
        set -o pipefail
        ./gradlew assembleDebug 2>&1 | tee build.log
    - if: failure()
      run: |
        msg=$(grep -E "^e: |error:|What went wrong" -A3 build.log | head -60 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
        echo "::error title=Build errors::${msg}"
    - env:
        GH_TOKEN: ${{ github.token }}
      run: |
        mkdir out
        for f in $(find app/build/outputs/apk -name '*.apk'); do
          flavor=$(basename "$(dirname "$(dirname "$f")")"); cp "$f" "out/test-$flavor.apk"
        done
        ls -la out
        gh release create test-perms out/*.apk --repo "${{ github.repository }}" --target "${{ github.sha }}" \
          --prerelease --title "Test: permission builds" --notes "Only for finding which permission the benco rejects."
